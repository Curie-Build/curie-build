[package]
name = "curie-build"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://curie-build.org"
description = "The Curie build tool"
build = "build.rs"
readme = "../README.md"

[[bin]]
name = "curie"
path = "src/main.rs"

[dependencies]
toml = "1.1.2"
toml_edit = "0.25.12"
serde = { version = "1", features = ["derive"] }
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
zip = { version = "8", default-features = false, features = ["deflate"] }
curie-deps = { version = "0.5.0", path = "../curie-deps" }
indicatif = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha1 = "0.11"
sha2 = "0.11"
which = "8.0.3"
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7"] }
portable-pty = "0.9"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ansi-to-tui = "8"
time = { version = "0.3", features = ["local-offset"] }
terminal_size = "0.4"
quick-xml = { version = "0.40", features = ["serialize"] }
tempfile = "3"

[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
filetime = "0.2"
