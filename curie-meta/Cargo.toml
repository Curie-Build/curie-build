[package]
name = "curie-meta"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://curie-build.org"
description = "Programmatic metadata API for Curie projects"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
anyhow = "1"
curie-deps = { version = "0.6.0", path = "../curie-deps" }

[dev-dependencies]
tempfile = "3"
