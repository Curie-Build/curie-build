[package]
name = "curie-openapi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Curie plugin: generate Java sources from OpenAPI specs"

[[bin]]
name = "curie-openapi"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
