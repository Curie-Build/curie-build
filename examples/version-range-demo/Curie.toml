# version-range-demo
#
# Demonstrates Curie's version-range detection and how to fix it.
#
# com.github.stefanbirkner:system-rules:1.18.0 declares its JUnit dependency
# as the Maven version range [4.9,) rather than a specific version.  Curie
# treats this as a hard error: ranges are non-deterministic and break
# reproducible builds.
#
# Without the explicit pin below, `curie build` would fail with:
#
#   non-deterministic version ranges in dependency graph
#
#     junit:junit-dep
#       "[4.9,)"  declared in com.github.stefanbirkner:system-rules:1.18.0
#
#   Pin these artifacts in Curie.toml to fix:
#     [dependencies]
#     "junit:junit-dep" = "<version>"
#
# Adding the explicit pin restores deterministic resolution.
#
# `curie fetch` (ad-hoc downloads, not a reproducible build) handles ranges
# differently: instead of asking you to find a version, it queries
# maven-metadata.xml and proposes the exact one.  For example,
#
#   curie fetch ch.epfl.scala:bsp4j:2.1.1
#
# fails with a ready-to-run command that pins the ranged transitive:
#
#   curie fetch ch.epfl.scala:bsp4j:2.1.1 com.google.code.gson:gson:2.10.1
#
# `curie fetch` also accepts several coordinates at once; a supplied coordinate
# overrides the matching transitive range.  With `--file`, the same fix is
# phrased as the coordinate line to add to the file.

[application]
name = "version-range-demo"
version = "0.1.0"

[dependencies]
"com.github.stefanbirkner:system-rules" = "1.18.0"
"junit:junit-dep"                        = "4.10"   # pins the transitive range dep
