# fat-jar-demo
#
# Demonstrates fat/uber JAR packaging with Curie:
#
#   - All (or selected) dependencies are bundled into a single self-contained JAR
#   - META-INF/services files are merged across all JARs
#   - Global default via [fat-jar].shadeAll; per-dep `shade = true/false` (legacy `fatJar` also accepted for now)
#   - Package relocations (`from` / `to`) at global or per-dep level; per-dep relocations force shading and are safety-checked for overlaps
#
# Build:   curie --project examples/fat-jar-demo build
# Run:     java -jar target/fat-jar-demo-0.1.0-fat.jar

[application]
name = "fat-jar-demo"
version = "0.1.0"
mainClass = "com.example.fatjar.FatJarApp"

[java]
sourceCompatibility = "21"

[dependencies]
# Jackson for JSON processing — included in fat JAR (default because shadeAll = true)
"com.fasterxml.jackson.core:jackson-databind" = "2.17.2"

# Guava for collections — included and relocated (global relocation rules)
"com.google.guava:guava" = "33.2.1-jre"

# SLF4J API — excluded from fat JAR (provided at runtime by the container)
"org.slf4j:slf4j-api" = { version = "2.0.13", shade = false }

[fat-jar]
enabled = true
# Explicit global default (true = historical "bundle everything unless per-dep shade=false")
shadeAll = true

# Relocate Guava (and thirdparty bits) using the new from/to syntax.
# These global rules are applied to project classes + any dep that doesn't
# declare its own relocations.
[[fat-jar.relocations]]
from = "com.google.common"
to = "com.example.fatjar.shaded.com.google.common"

[[fat-jar.relocations]]
from = "com.google.thirdparty"
to = "com.example.fatjar.shaded.com.google.thirdparty"