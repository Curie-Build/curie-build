# Foreign-projects demo — Curie workspace mixing Curie and foreign members.
#
# Curie members:
#   greeter-lib   — Curie library
#   app           — Curie application (depends on greeter-lib + foreign jars)
#   isolated-app  — Curie app built as a *foreign curie* member (child process)
#
# Foreign members (auto-detected from markers unless noted):
#   legacy-lib    — Make  (Makefile)
#   maven-lib     — Maven (pom.xml)
#   gradle-lib    — Gradle (build.gradle / settings.gradle)
#   rust-tool     — Cargo (Cargo.toml)
#   cmake-lib     — CMake (CMakeLists.txt)
#   npm-frontend  — npm   (package.json)
#
# [maven] sync is disabled: foreign members have no Curie pom sync story, and
# a Curie member depending on foreign jars cannot be expressed as Maven modules.

[workspace]
members = [
    "greeter-lib",
    "app",
    "legacy-lib",
    "maven-lib",
    "gradle-lib",
    "rust-tool",
    "cmake-lib",
    "npm-frontend",
    "isolated-app",
]

[maven]
sync = false

[workspace.foreign.legacy-lib]
artifacts = ["out/legacy-lib.jar"]
env = { GREETING_SUFFIX = "!" }

[workspace.foreign.maven-lib]
artifacts = ["target/maven-lib-0.1.0.jar"]

[workspace.foreign.gradle-lib]
artifacts = ["build/libs/gradle-lib-0.1.0.jar"]

[workspace.foreign.rust-tool]
# Ordering-only: wait for make + maven before cargo.
dependencies = ["legacy-lib", "maven-lib"]

[workspace.foreign.cmake-lib]
# Ordering-only: native lib after Java foreign libs.
dependencies = ["legacy-lib"]
artifacts = ["build/libcmake_lib.a"]

[workspace.foreign.npm-frontend]
# Ordering-only: frontend after backend foreign libs.
dependencies = ["rust-tool", "gradle-lib", "cmake-lib"]

[workspace.foreign.isolated-app]
dependencies = ["greeter-lib"]
env = { APP_PROFILE = "foreign-curie" }
