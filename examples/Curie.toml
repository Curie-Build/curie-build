# Examples workspace.
#
# Each member directory is an independent Curie project (application or
# library) with its own Curie.toml.
#
# Workspace-level config (below) is inherited by every member:
#   - [bom-imports] / [test-bom-imports] are merged with each member's
#     own BOM imports; member entries take precedence on a name collision.
#
# No workspace-level [java] releaseVersion is set, so each member
# compiles against the running JDK's own version by default.
#
# Most members use the flat-package layout; `maven-string-utils` is the
# representative for the classic Maven `src/main/java/` + `src/test/java/`
# layout (incl. tests co-located in src/main/java).

[workspace]
members = [
    "hello-world",
    "jackson-bom-greeter",
    "json-greeter",
    "oci-demo",
    "string-utils",
    "string-utils-cli",
    "auto-value-demo",
    "lombok-greeter",
    "maven-string-utils",
    "hello-kotlin",
    "hello-mixed",
    "graalvm-hello",
    "jlink-hello",
    "nested-workspace-demo",
    "verbose-test-demo",
    "my-platform-bom",
    "fat-jar-demo",
    "fat-jar-selective-demo",
    "test-ap-demo",
    "exclusion-demo",
    "version-conflict-demo",
    "version-range-demo",
    "groovy-greeter",
    "spock-demo",
    "simplified-main",
    "add-remove-demo",
    "google-mirror-demo",
    "shibboleth-demo",
    "publish-demo",
    "spring-boot-demo",
    "proto-greeter",
    "openapi-greeter",
    "resource-filtering-demo",
    "liquid-filtering-demo",
    "polyrepo-demo",
    "foreign-projects-demo",
]

[bom-imports]
"com.fasterxml.jackson:jackson-bom" = "2.17.2"

[test-bom-imports]
"org.junit:junit-bom" = "5.11.0"

# Workspace-level defaults for the two tool versions that Curie downloads.
# Every member inherits these unless it declares its own [test] or [kotlin].
[test]
junitPlatformVersion = "6.0.3"

[kotlin]
version = "2.1.21"

# Keep each member's pom.xml in sync with Curie.toml, so `mvn` can build the
# same project (see _design/MAVEN-SYNC.md).
[maven]
sync = true
