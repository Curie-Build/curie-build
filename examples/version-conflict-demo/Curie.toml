# version-conflict-demo
#
# Demonstrates Curie's major-version conflict guard and the per-dependency
# `allowVersionConflict` override.
#
# We pin Guava to 32.1.3-jre (major 32), but Guice 4.0 was built against
# Guava 16.0.1 (major 16). Nearest-wins keeps our 32.1.3-jre, but because the
# majors differ Curie would normally FAIL the build — a major-version gap is a
# common source of NoSuchMethodError / NoClassDefFoundError at runtime.
#
# Guava is famously backwards-compatible across these majors, so here the
# override is appropriate: `allowVersionConflict = true` tells Curie the pin is
# intentional and the build proceeds (still using 32.1.3-jre).
#
# Remove `allowVersionConflict = true` to see the error and its guidance.

[application]
name = "version-conflict-demo"
version = "0.1.0"
mainClass = "com.example.VersionConflictDemo"

[dependencies]
"com.google.guava:guava" = { version = "32.1.3-jre", allowVersionConflict = true }
"com.google.inject:guice" = "4.0"
