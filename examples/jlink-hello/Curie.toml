# jlink-hello
#
# Demonstrates a self-contained JDK runtime image with `curie jlink`.
# Unlike `curie native` (GraalVM), this uses the plain JDK's own `jlink` —
# no GraalVM install required, works with any JDK 21+ already on PATH.
#
#   curie --project examples/jlink-hello build
#
# or use the faster iteration command:
#
#   curie --project examples/jlink-hello jlink
#
# Produces target/runtime/{jdk,lib,bin}; run it with:
#
#   ./target/runtime/bin/jlink-hello
#
# Since [docker] is also enabled below, `curie build` additionally produces
# a Docker image that bundles the whole runtime/ tree (no separate JRE base
# image needed — the jlink runtime already has its own) and runs the
# launcher as its entrypoint.

[application]
name = "jlink-hello"
version = "0.1.0"
mainClass = "com.example.Hello"

# Opt in to jlink runtime-image assembly.
# The section must be explicitly present to trigger the jlink step.
[jlink]
# modules omitted — auto-detected via jdeps against the built JAR
stripDebug = true
compress = true

# Opt in to Docker image building. Since [jlink] is enabled above, the
# generated Dockerfile packages the jlink runtime image (target/runtime/)
# instead of the plain JAR, on a minimal glibc base (debian:trixie-slim
# by default) rather than a JRE image.
[docker]
